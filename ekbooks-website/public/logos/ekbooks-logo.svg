<svg width="220" height="80" viewBox="0 0 220 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- EB Badge with gradient -->
  <defs>
    <linearGradient id="ebGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00843D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077C5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect x="10" y="20" width="35" height="40" rx="6" fill="url(#ebGradient)"/>
  <text x="27.5" y="47" font-family="Merriweather, serif" font-weight="700" font-size="22" fill="white" text-anchor="middle">EB</text>
  
  <!-- EKBooks Text -->
  <text x="55" y="43" font-family="Merriweather, serif" font-weight="600" font-size="22" fill="#32302f">EKBooks</text>
  
  <!-- Tagline -->
  <text x="55" y="57" font-family="Open Sans, sans-serif" font-weight="400" font-size="10" fill="#6b6b6b">Professional Accounting</text>
  
  <!-- Accent Line -->
  <line x1="55" y1="48" x2="150" y2="48" stroke="#1D2D5C" stroke-width="2"/>
</svg>