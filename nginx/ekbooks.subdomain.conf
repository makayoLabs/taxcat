# EKBooks Subdomain Configuration for SWAG
# Place this file in your SWAG nginx/proxy-confs directory

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name ekbooks.ca www.ekbooks.ca;

    include /config/nginx/ssl.conf;

    client_max_body_size 50M;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private must-revalidate auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;" always;

    # Main application proxy
    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app ekbooks-app;
        set $upstream_port 3000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://192.168.2.125:$upstream_port;

        # WebSocket support for real-time features
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Additional proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # API routes with special handling
    location /api/ {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app ekbooks-app;
        set $upstream_port 3000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://192.168.2.125:$upstream_port;

        # CORS headers for API
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # Static files caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app ekbooks-app;
        set $upstream_port 3000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://192.168.2.125:$upstream_port;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /api/health {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app ekbooks-app;
        set $upstream_port 3000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://192.168.2.125:$upstream_port;

        access_log off;
    }

    # Marketing pages optimization
    location ~* ^/(about|services|contact|pricing)$ {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app ekbooks-app;
        set $upstream_port 3000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://192.168.2.125:$upstream_port;

        # Cache marketing pages for 1 hour
        expires 1h;
        add_header Cache-Control "public";
    }

    # Admin area protection (optional - uncomment if needed)
    # location /admin {
    #     include /config/nginx/proxy.conf;
    #     include /config/nginx/resolver.conf;
    #     set $upstream_app ekbooks-app;
    #     set $upstream_port 3000;
    #     set $upstream_proto http;
    #     proxy_pass $upstream_proto://192.168.2.125:$upstream_port;
    #     
    #     # Basic auth protection (optional)
    #     auth_basic "Admin Area";
    #     auth_basic_user_file /config/nginx/.htpasswd;
    # }
}




